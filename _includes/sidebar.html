<input type="checkbox" id="sidebar-checkbox" class="sidebar-checkbox" lang="zh-Hant" aria-label="導覽選單" aria-controls="sidebar">
<label class="menuicon" for="sidebar-checkbox" aria-hidden="true">
  <span class="bread bread-top"><span class="crust crust-top"></span></span>
  <span class="bread bread-bottom"><span class="crust crust-bottom"></span></span>
</label>
<label class="sidebar-backdrop" for="sidebar-checkbox" aria-hidden="true"></label>

<aside class="sidebar" id="sidebar" lang="zh-Hant">
  <div class="sidebar-heading">
    <span class="sidebar-title">{{ site.title }}</span>
  </div>

  <nav class="sidebar-nav" aria-label="主要導覽">
    <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V20h13V9.5M9.5 20v-6h5v6"></path></svg>
      首頁
    </a>

    {% assign pages_list = site.pages | sort: "url" %}
    {% for node in pages_list %}
      {% if node.path == "about.md" %}
        <a class="sidebar-nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url | relative_url }}"{% if page.url == node.url %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
          關於
        </a>
      {% endif %}
    {% endfor %}

    <a class="sidebar-nav-item{% if page.url == '/portfolio/' %} active{% endif %}" href="{{ '/portfolio/' | relative_url }}"{% if page.url == '/portfolio/' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M8 6V4h8v2M3 11h18"></path></svg>
      作品集
    </a>
    <a class="sidebar-nav-item{% if page.url == '/archive/' %} active{% endif %}" href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"></path><path d="M3 3v5h5M12 7v5l3.5 2"></path></svg>
      歷史
    </a>
    <a class="sidebar-nav-item{% if page.url == '/tags/' %} active{% endif %}" href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 13 13 20 3 10V3h7l10 10Z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>
      標籤
    </a>
  </nav>

  <div class="sidebar-secondary">
    <a class="sidebar-external" href="https://github.com/{{ site.repository }}" aria-label="GitHub 程式碼庫">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"></path></svg>
    </a>
  </div>

  <div class="sidebar-item">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</aside>

<script>
  document.addEventListener('keydown', function (event) {
    var menu = document.getElementById('sidebar-checkbox');
    if (event.key === 'Escape' && menu.checked) {
      menu.checked = false;
      menu.focus();
    }
  });
</script>
